# Ephemeral single-node Kafka (KRaft) for integration tests on the rpi-k3s
# cluster (BASE-006/007). External clients use the NodePort listener with an
# advertised address pointing at the control-plane node IP; the internal
# listener keeps broker-to-broker traffic sane.
#
# Usage (external-DSN mode for tests):
#   ALERT_TEST_KAFKA_BROKERS=10.10.10.20:30092
#
# Matches the postgres-test pattern in deploy/test/pg-test.yaml; both live in
# the alert-platform ns (pods<=30, nodeports<=10 quota).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-test
  namespace: alert-platform
  labels:
    app: kafka-test
    purpose: integration-test
spec:
  replicas: 1
  strategy:
    type: Recreate # single broker, PVC-backed
  selector:
    matchLabels:
      app: kafka-test
  template:
    metadata:
      labels:
        app: kafka-test
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - containerPort: 29092
              name: internal
            - containerPort: 30092
              name: external
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-test:29093"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://:29092,EXTERNAL://:30092,CONTROLLER://:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              # Control-plane node IPs serve NodePorts; advertise the primary.
              value: "INTERNAL://kafka-test:29092,EXTERNAL://10.10.10.20:30092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true" # test environment convenience; prod config differs
          readinessProbe:
            tcpSocket:
              port: 29092
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-test
  namespace: alert-platform
spec:
  type: NodePort
  selector:
    app: kafka-test
  ports:
    - name: external
      port: 30092
      targetPort: 30092
      nodePort: 30092
    - name: internal
      port: 29092
      targetPort: 29092
