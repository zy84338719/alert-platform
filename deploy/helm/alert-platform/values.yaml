# Defaults target a DEV cluster (single-replica, small requests). Production
# overlays raise replicas/resources and set the registry/image tags.
image:
  registry: ""          # set per environment, e.g. registry.example.com/infra
  repository: alert-platform
  tag: "0.3.0-dev"
  pullPolicy: IfNotPresent

# Pin all pods to one node when the image is delivered by node-local import
# (no registry in the dev cluster); empty = schedule anywhere.
nodeSelector: {}

# Central components (api + worker). Edge runs per-cluster with mode=gateway.
api:
  enabled: true
  replicas: 2
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
  env:
    ALERT_KAFKA_BROKERS: "kafka:9092"
    ALERT_PG_DSN: "postgres://alert:alert@postgres:5432/alert_platform?sslmode=disable"

worker:
  enabled: true
  # P10-008: all|processor|notifier|maintenance. Scale Kafka consumption with
  # a separate Deployment using profile=processor so singleton loops do not
  # multiply; maintenance loops are DB-leased even if replicated by mistake.
  profile: "all"
  replicas: 2
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
  env:
    ALERT_KAFKA_BROKERS: "kafka:9092"
    ALERT_PG_DSN: "postgres://alert:alert@postgres:5432/alert_platform?sslmode=disable"
    ALERT_STALE_AFTER: "5m"

# P10-008/P11: dedicated Kafka processor pool (profile=processor). Disabled by
# default; enable and scale independently of the singleton worker loops.
workerProcessor:
  enabled: false
  replicas: 1
  resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
  env: {}

migrate:
  enabled: true          # job runs before api/worker roll out
  env:
    ALERT_PG_DSN: "postgres://alert:alert@postgres:5432/alert_platform?sslmode=disable"

edge:
  enabled: false         # enable in per-cluster overlays
  mode: gateway          # gateway | collector
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
  wal:
    sizeLimit: 2Gi
    storageClass: ""     # empty = default SC
  env:
    ALERT_API_ORIGIN: "http://alert-platform-api:8080"
    ALERT_EDGE_SOURCES_FILE: "/etc/edge/edge-sources.json"
  sources: []            # static vendor credentials (secret-managed)
  huatuo: {}

networkPolicy:
  enabled: true
  # P1-04/P8-P1-02: per-component policies. api/worker -> kafka+pg+DNS;
  # worker also notification channels; edge -> central api + DNS only.
  egress:
    kafkaNamespace: "infra"
    postgresNamespace: "infra"
    # P8-P1-02: notification channels (feishu/dingtalk/webhook) are runtime-
    # configured external URLs and standard NetworkPolicy cannot match FQDNs.
    # The worker therefore gets PUBLIC TCP 80/443 only; in-cluster, private,
    # link-local and metadata ranges stay denied. Set enabled=false for a
    # fully deny-by-default policy and list endpoints in workerExtraEgress
    # (use Cilium FQDN policies where available rather than assuming domain
    # names work in stock Kubernetes NetworkPolicy).
    notificationEgress:
      enabled: true
      ports: [80, 443]
    # Edge -> central api: set when the center lives in ANOTHER namespace
    # (multi-cluster / shared services). Empty = same-namespace pod only.
    edgeCentralNamespace: ""
    edgeCentralPort: 8080
    # Extra egress per component (deny-by-otherwise otherwise):
    #   worker: additional notification endpoints when notificationEgress is
    #     off — e.g. [{to: [{ipBlock: {cidr: "203.0.113.0/24"}}]}]
    #   edge: collector mode upstreams (e.g. the HUATUO node) — same shape.
    workerExtraEgress: []
    apiExtraEgress: []
    edgeExtraEgress: []

# P9-OBS-07: self-monitoring alert rules (Prometheus Operator CRD).
# Disabled by default — most clusters install kube-prometheus-stack with its
# own rule selector; set labels to the selector your Prometheus uses.
prometheusRule:
  enabled: false
  labels: {}
  extraRules: []

pdb:
  enabled: true
  minAvailable: 1

serviceMonitor: false    # enable where a Prometheus Operator exists
