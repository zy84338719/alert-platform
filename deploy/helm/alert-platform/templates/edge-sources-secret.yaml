{{- if and .Values.edge.enabled .Values.edge.sources }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alert-platform.fullname" . }}-edge-sources
  labels: {{- include "alert-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  edge-sources.json: {{ toJson (dict "sources" .Values.edge.sources) | quote }}
{{- end }}
