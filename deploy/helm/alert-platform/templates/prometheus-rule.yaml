{{- if .Values.prometheusRule.enabled }}
# P9-OBS-07: platform self-monitoring rules. Requires the Prometheus Operator
# CRD (monitoring.coreos.com/v1) and a rule selector that matches the labels
# below (`prometheusRule.labels` is where per-install selectors go).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "alert-platform.fullname" . }}
  labels:
    {{- include "alert-platform.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: alert-platform.rules
      rules:
        - alert: AlertPlatformIngestRejectRateHigh
          expr: sum(rate(alert_platform_ingest_rejected_total[5m])) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "alert-platform ingest is rejecting requests"
            description: "Rejection rate > 0.5/s for 10m (auth, validation or broker failures)."
        - alert: AlertPlatformConsumerLagHigh
          expr: max(alert_platform_consumer_lag) > 1000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "alert-platform consumer lag above 1000"
            description: "Processors are not keeping up; scale replicas or check the broker."
        - alert: AlertPlatformDLQGrowing
          expr: increase(alert_platform_dlq_quarantined_total[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "poison messages quarantined into the DLQ"
            description: "A source adapter is emitting contract-violating events; inspect alert.dlq.v1."
        - alert: AlertPlatformNotifyFailures
          expr: sum(rate(alert_platform_notify_attempt_total{result!="sent"}[10m])) > 0.1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "alert-platform notifications are failing"
            description: "Non-sent attempt rate > 0.1/s for 10m (vendor rejection, SSRF guard or channel outage)."
        - alert: AlertPlatformNotifyBacklog
          expr: alert_platform_notify_pending > 100
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "notification backlog above 100"
            description: "Pending/retry tasks are accumulating in the current authority generation."
        - alert: AlertPlatformNotifyDeadLettered
          expr: increase(alert_platform_notify_failed_total[15m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "notifications were dead-lettered"
            description: "A channel/task was permanently rejected or exhausted its retry budget; replay after fixing the channel (POST /notifications/v1/{id}/replay)."
        - alert: AlertPlatformNotifyRetryStorm
          expr: sum(rate(alert_platform_notify_attempt_total{result=\"retryable\"}[10m])) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "notification retry rate above 1/s"
            description: "A channel is failing transiently and retrying; check vendor status and channel config."
        - alert: AlertPlatformEdgeWALRejected
          expr: increase(alert_platform_edge_wal_rejected_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "edge WAL rejected vendor data"
            description: "The edge could not durably append a batch (disk full/io error); vendor retries will amplify until the PVC is fixed."
        - alert: AlertPlatformEdgeUploadPoison
          expr: increase(alert_platform_edge_upload_poison_total[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "center permanently rejected an edge batch (4xx)"
            description: "A poison batch is pinned at the WAL head; inspect the edge logs, fix/remove the batch, then replay."
        {{- with .Values.prometheusRule.extraRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}