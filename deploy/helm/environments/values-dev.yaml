# MC-001/EDGE-003: dev 集群（rpi-k3s，7 节点 arm64）实装配置。
# 镜像经节点本地导入（无集群内 registry，见 DEVELOPMENT_LOG R15），
# 因此全部 Pod 钉在持有镜像的节点 rpi4-011 上。
image:
  registry: ""
  repository: alert-platform
  tag: "0.3.0-dev"
  pullPolicy: IfNotPresent

nodeSelector:
  kubernetes.io/hostname: rpi4-011

migrate:
  enabled: true
  env:
    # 集群内 dev PG（deploy 见 /tmp/dev-pg 部署记录；生产用 ARC-005 规格）
    ALERT_PG_DSN: "postgres://postgres:postgres@dev-pg.alert-platform.svc:5432/alert_platform?sslmode=disable"

api:
  enabled: true
  replicas: 1
  env:
    ALERT_PG_DSN: "postgres://postgres:postgres@dev-pg.alert-platform.svc:5432/alert_platform?sslmode=disable"
    ALERT_KAFKA_BROKERS: "dev-kafka.alert-platform.svc:9092"  # 集群暂无 Kafka；producer 惰性连接不影响 readiness

worker:
  enabled: false   # 集群暂无 Kafka：consumer 会 fail-stop 反复重启；待 Kafka 接入后开启
  replicas: 1
  env: {}

edge:
  enabled: true
  mode: gateway
  replicas: 1
  wal:
    sizeLimit: 1Gi
  env:
    ALERT_API_ORIGIN: "http://ap-dev-alert-platform-api:8080"
  sources: []   # 来源凭证后补（edge 网关对未知凭证返回 401，不崩溃）

networkPolicy:
  enabled: true
  egress:
    kafkaNamespace: alert-platform    # dev 依赖同 ns（网络策略已放行同 ns 出向）
    postgresNamespace: alert-platform

pdb:
  enabled: true
  minAvailable: 1
