name: contract-and-domain
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # BASE-003: tool versions (buf/protoc-gen-go/hz) live in go.mod `tool`
      # directives — no separate setup action, so CI and local runs are the
      # same binaries by construction.
      - name: buf lint / build (go tool, version-locked)
        run: |
          go tool buf lint
          go tool buf build
      - name: buf breaking (git baseline once main exists)
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            go tool buf breaking --against '.git#branch=origin/main'
          else
            echo "no origin/main baseline yet; directory-baseline drill runs below"
          fi
      - name: breaking-change drill (red blocked, green passes)
        run: bash scripts/breaking_drill.sh
      # ING-004: vendor contract tests run in `go test ./...` above (golden +
      # negative fixtures); the drill proves they fail on a corrupted fixture.
      - name: vendor contract drill (red blocked, green passes)
        run: bash scripts/contract_drill.sh
      - name: generated-code drift (gen/ in sync with protos)
        run: make idl-drift
      - run: go build ./...
      - run: go test ./...
      # BASE-005 PG integration (Testcontainers; runner provides Docker).
      - run: go test -count=1 -v ./internal/infrastructure/postgres/
      - run: python3 scripts/check_deps.py
      - run: python3 scripts/validate_package.py

  # BASE-004: multi-arch image + SBOM. Every run builds linux/amd64+arm64
  # with SBOM/provenance attestations and uploads the OCI archive; pushing to
  # the dev registry happens only on main AND only when DEV_REGISTRY is
  # configured (otherwise the push step reports the blocker and the job stays
  # green for the parts that are verifiable).
  image:
    runs-on: ubuntu-latest
    needs: verify
    env:
      DEV_REGISTRY: ${{ secrets.DEV_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Version stamp
        id: meta
        run: echo "version=0.1.0-dev+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build multi-arch image with SBOM (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: true
          outputs: type=oci,dest=/tmp/alert-platform.tar
      - uses: actions/upload-artifact@v4
        with:
          name: alert-platform-oci
          path: /tmp/alert-platform.tar
      - name: Push to dev registry (main only, secret-gated)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DEV_REGISTRY != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: true
          push: true
          tags: |
            ${{ env.DEV_REGISTRY }}/alert-platform:${{ steps.meta.outputs.version }}
            ${{ env.DEV_REGISTRY }}/alert-platform:latest
      - name: Report registry blocker if unconfigured
        if: env.DEV_REGISTRY == ''
        run: echo "::notice::DEV_REGISTRY secret not configured — image built and archived, push skipped (BASE-004 blocker pending registry onboarding)"
# Release gates must additionally pin action versions/SHA and add payload contract tests.
